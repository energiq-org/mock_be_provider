name: Deploy and Build Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - devops/*

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retrieve current Date Time in Singapore TimeZone
        shell: bash
        run: echo "DATE=$(date +'%Y-%m-%d-%H-%M-%SZ')" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ format('{0}:{1}', env.IMAGE_NAME, env.DATE) }}

      - name: Update Deployment Configuration
        run: |
          # Set up SSH key
          mkdir -p ~/.ssh
          echo "${{ secrets.ACTIONS }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          
          # Clone infrastructure repository
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git clone git@github.com:energiq-org/infra.git
          cd infra
          
          # Determine which file to update based on branch
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            CONFIG_FILE="prod/deployments/energi-backend.yaml"
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            CONFIG_FILE="dev/deployments/energi-backend.yaml"
          else
            echo "Not updating deployment config for this branch"
            exit 0
          fi
          
          # Update the image tag in the configuration file
          IMAGE_TAG="${{ env.DATE }}"
          sed -i "s|image: ghcr.io/energiq-org/be_user:[0-9-]*z|image: ghcr.io/energiq-org/be_user:$IMAGE_TAG|g" $CONFIG_FILE
          
          # Commit and push the changes
          git add $CONFIG_FILE
          if ! git diff --cached --quiet; then
            git commit -m "Update image tag to $IMAGE_TAG for ${{ github.ref_name }} deployment"
            git push
          else
            echo "No changes to commit."
          fi
